<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Neural Synapse Connections -->
  <g stroke="rgba(56, 189, 248, 0.4)" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="180" x2="256" y2="140" />
    <line x1="160" y1="180" x2="256" y2="256" />
    <line x1="160" y1="332" x2="256" y2="256" />
    <line x1="160" y1="332" x2="256" y2="372" />
    <line x1="256" y1="140" x2="352" y2="200" />
    <line x1="256" y1="256" x2="352" y2="200" />
    <line x1="256" y1="256" x2="352" y2="312" />
    <line x1="256" y1="372" x2="352" y2="312" />
    <line x1="352" y1="200" x2="400" y2="256" />
    <line x1="352" y1="312" x2="400" y2="256" />
  </g>

  <!-- Input Layer Nodes -->
  <circle cx="160" cy="180" r="26" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="160" cy="332" r="26" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Hidden Layer 1 Nodes -->
  <circle cx="256" cy="140" r="24" fill="#0284c7" />
  <circle cx="256" cy="256" r="30" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="372" r="24" fill="#0284c7" />

  <!-- Hidden Layer 2 Nodes -->
  <circle cx="352" cy="200" r="24" fill="url(#amberGrad)" />
  <circle cx="352" cy="312" r="24" fill="url(#amberGrad)" />

  <!-- Output Node -->
  <circle cx="400" cy="256" r="28" fill="#10b981" filter="url(#glow)"/>

  <!-- Core Spark Mark -->
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
